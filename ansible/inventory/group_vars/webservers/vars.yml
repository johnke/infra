# Web server specific variables (OpenBSD)

# TLS certificates
# Managed outside Ansible: johnke.me uses a Cloudflare Origin Certificate
# (valid to 2041, covers johnke.me + *.johnke.me). Install by hand on the
# host -- the playbook only verifies the files exist. See CLAUDE.md.

# Base directories
# nginx on OpenBSD is chrooted to /var/www, so document roots live beneath it
# and are referenced in configs WITHOUT the /var/www prefix.
chroot_base: /var/www
web_root_base: /var/www/htdocs

# Log directory, referenced by REAL path (not chroot-relative): nginx opens
# its log files as root before chrooting, so absolute host paths work for the
# daemon and, unlike /logs/..., also resolve under `nginx -t` (which runs
# outside the chroot). Document roots are different -- those ARE
# chroot-relative, because they are resolved after the chroot.
nginx_log_dir: /var/www/logs

# OpenBSD's web user/group (equivalent of www-data on Debian)
web_user: www
web_group: www

# Nginx sites configuration
# Each site gets one config file in /etc/nginx/conf.d/, included by nginx.conf
nginx_sites:
  - name: johnke.me
    server_names:
      - johnke.me
      - www.johnke.me
      - johnke.wtf
      - www.johnke.wtf
    root: "{{ web_root_base }}/johnke.me"
    ssl_enabled: true
    ssl_certificate: /etc/ssl/johnke.me.fullchain.pem
    ssl_certificate_key: /etc/ssl/private/johnke.me.key
    # Custom config snippets (optional)
    custom_config: |
      rewrite ^/feed$  /index.xml permanent;
      rewrite ^/feed/$ /index.xml permanent;

  - name: kathleenkelleher.com
    server_names:
      - kathleenkelleher.com
      - www.kathleenkelleher.com
    root: "{{ web_root_base }}/kathleenkelleher.com/kathleenkelleher.com"
    ssl_enabled: false

