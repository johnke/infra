# Firewall: open the web ports on top of the defaults in group_vars/all
pf_allowed_tcp_ports:
  - 80
  - 443

# Restrict 80/443 to Cloudflare's edge ranges only (origin protection).
# johnke.me is proxied and uses a Cloudflare Origin certificate, which is not
# browser-trusted, so direct-to-origin web traffic has no legitimate use.
#
# TRADE-OFF: this blocks direct access to 46.23.90.156 for debugging, and any
# domain you grey-cloud stops working until the proxy is back on. SSH is
# unaffected (it has its own rule and must never go through Cloudflare).
cloudflare_only_web: true
cloudflare_web_ports:
  - 80
  - 443
cloudflare_ip_file: /etc/pf.cloudflare
nginx_cloudflare_snippet: /etc/nginx/cloudflare-real-ip.conf
# Refresh cadence for the published ranges. They change rarely but do change.
cloudflare_ip_refresh: weekly

# No WireGuard peers while the tunnel is disabled, so 51820/udp stays closed.
pf_allowed_udp_ports: []

# WireGuard hub interface on caesar. Disabled along with the linkding site.
wg_enabled: false
