[defaults]
inventory = inventory/hosts
host_key_checking = False
retry_files_enabled = False
roles_path = roles
interpreter_python = auto_silent

# Use vault for encrypted variables
vault_password_file = ../.vault_pass

# Improve output
stdout_callback = default
result_format = yaml
callbacks_enabled = profile_tasks

[privilege_escalation]
become = True
# Per-group override: OpenBSD hosts use doas (see inventory/hosts)
become_method = sudo
become_user = root
# caesar's doas.conf requires a password (`permit johnke`), so the SSH key
# alone does not grant root. Prompting here means you never need to remember
# -K; without it doas returns "Authentication required" and the module output
# fails to parse as JSON, which is a confusing way to learn you forgot.
# The Pi uses passwordless sudo, so it ignores the prompt.
become_ask_pass = True

[ssh_connection]
pipelining = True
