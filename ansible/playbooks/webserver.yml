---
# Web server configuration

- name: Install nginx, certbot, supervisor, and Docker dependencies
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
      - supervisor
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: Allow HTTP through UFW
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS through UFW
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Ensure SSL dhparam file exists
  ansible.builtin.command:
    cmd: openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048
    creates: /etc/ssl/certs/dhparam.pem
  when: nginx_sites | selectattr('ssl_enabled', 'defined') | selectattr('ssl_enabled') | list | length > 0

- name: Create web root directories
  ansible.builtin.file:
    path: "{{ item.root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0775'  # Group writable for deployments
  loop: "{{ nginx_sites }}"
  when: nginx_sites is defined and nginx_sites | length > 0

- name: Deploy static nginx site configurations
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ nginx_sites }}"
  notify: reload nginx
  when: nginx_sites is defined and nginx_sites | length > 0 and (item.site_type | default('static')) == 'static'

- name: Deploy Django nginx site configurations
  ansible.builtin.template:
    src: nginx-django-site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ nginx_sites }}"
  notify: reload nginx
  when: nginx_sites is defined and nginx_sites | length > 0 and item.site_type is defined and item.site_type == 'django'

- name: Deploy Docker nginx site configurations
  ansible.builtin.template:
    src: nginx-docker-site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ nginx_sites }}"
  notify: reload nginx
  when: nginx_sites is defined and nginx_sites | length > 0 and item.site_type is defined and item.site_type == 'docker'

- name: Enable nginx sites
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.name }}"
    dest: "/etc/nginx/sites-enabled/{{ item.name }}"
    state: link
  loop: "{{ nginx_sites }}"
  notify: reload nginx
  when: nginx_sites is defined and nginx_sites | length > 0

- name: Ensure nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: Set up certbot renewal timer
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: yes
    state: started

# Django-specific tasks
- name: Create Django app log directories
  ansible.builtin.file:
    path: "{{ item.root }}/logs"
    state: directory
    owner: www-data
    group: www-data
    mode: '0775'  # Group writable for deployments
  loop: "{{ nginx_sites }}"
  when: nginx_sites is defined and item.site_type is defined and item.site_type == 'django'

- name: Deploy supervisor configurations for Django apps
  ansible.builtin.template:
    src: supervisor-django.conf.j2
    dest: "/etc/supervisor/conf.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ nginx_sites }}"
  notify: restart supervisor
  when: nginx_sites is defined and item.site_type is defined and item.site_type == 'django'

- name: Ensure supervisor is started and enabled
  ansible.builtin.service:
    name: supervisor
    state: started
    enabled: yes
  when: nginx_sites | selectattr('site_type', 'defined') | selectattr('site_type', 'equalto', 'django') | list | length > 0

# Docker-specific tasks
- name: Create Docker app directories
  ansible.builtin.file:
    path: "{{ item.docker_compose_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop: "{{ nginx_sites }}"
  when: nginx_sites is defined and item.site_type is defined and item.site_type == 'docker' and item.docker_compose_dir is defined

- name: Deploy Docker Compose files from templates
  ansible.builtin.template:
    src: "{{ item.docker_compose_template }}"
    dest: "{{ item.docker_compose_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  loop: "{{ nginx_sites }}"
  when: nginx_sites is defined and item.site_type is defined and item.site_type == 'docker' and item.docker_compose_template is defined

- name: Deploy Docker Compose files from static files
  ansible.builtin.copy:
    src: "{{ item.docker_compose_file }}"
    dest: "{{ item.docker_compose_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  loop: "{{ nginx_sites }}"
  when: nginx_sites is defined and item.site_type is defined and item.site_type == 'docker' and item.docker_compose_file is defined

- name: Deploy .env files for Docker apps
  ansible.builtin.template:
    src: "{{ item.docker_env_template }}"
    dest: "{{ item.docker_compose_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  loop: "{{ nginx_sites }}"
  when: nginx_sites is defined and item.site_type is defined and item.site_type == 'docker' and item.docker_env_template is defined

- name: Start Docker Compose services
  community.docker.docker_compose_v2:
    project_src: "{{ item.docker_compose_dir }}"
    state: present
  loop: "{{ nginx_sites }}"
  when: nginx_sites is defined and item.site_type is defined and item.site_type == 'docker' and item.docker_compose_dir is defined and (item.docker_compose_template is defined or item.docker_compose_file is defined)
