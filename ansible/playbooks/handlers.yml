---
# Handlers for all playbooks

- name: reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: restart nginx
  ansible.builtin.service:
    name: nginx
    state: restarted

- name: restart pihole-FTL
  ansible.builtin.service:
    name: pihole-FTL
    state: restarted

- name: reload pf
  ansible.builtin.command:
    cmd: pfctl -f /etc/pf.conf

- name: restart ntpd
  ansible.builtin.service:
    name: ntpd
    state: restarted

- name: restart wireguard interface
  ansible.builtin.command:
    cmd: "sh /etc/netstart {{ wg_interface }}"

- name: restart wireguard
  ansible.builtin.service:
    name: "wg-quick@{{ wg_interface }}"
    state: restarted

- name: reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
